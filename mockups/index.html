<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wishrack designs</title>
<style>
body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #eef1f5; color: #1f2937; }

h1 { font-size: 22px; margin: 0 0 4px; }

.phone { height: 560px; max-width: 260px; border-radius: 22px; border-width: 6px; border-color: #1f2937; }

<body><main>

  <figure><figcaption><b>A. Denim and leather patch</b>frontend-design skill: chambray blue, indigo ink, price tags as stitched leather patches.</figcaption>
